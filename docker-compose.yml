services:
  platform-core:
    build:
      context: ./platform-core
      dockerfile: Dockerfile
    container_name: lifeops-platform-core
    env_file:
      - ./platform-core/.env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health'); assert json.loads(response.read()) == {'status': 'ok'}\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 35s

  postgres:
    image: postgres:16-alpine
    container_name: lifeops-postgres
    env_file:
      - ./platform-core/.env.db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
