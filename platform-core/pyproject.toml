[build-system]
requires = ["setuptools>=75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeops-platform-core"
version = "0.1.0"
description = "Platform Core bootstrap for LifeOps Platform."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.13.3",
  "asyncpg==0.30.0",
  "bcrypt==4.2.1",
  "fastapi==0.115.0",
  "httpx==0.27.2",
  "pydantic-settings==2.5.2",
  "python-dotenv==1.0.1",
  "sqlalchemy[asyncio]==2.0.36",
  "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.auth" = ["common_passwords.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
