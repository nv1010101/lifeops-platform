[build-system]
requires = ["setuptools>=75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeops-platform-core"
version = "0.1.0"
description = "Platform Core bootstrap for LifeOps Platform."
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.0",
  "pydantic-settings==2.5.2",
  "python-dotenv==1.0.1",
  "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "pytest==8.3.3",
  "ruff==0.6.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
